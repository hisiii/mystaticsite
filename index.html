<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0078d4;
            color: white;
            padding: 30px;
        }

        main {
            padding: 50px;
        }

        h1 {
            color: #0078d4;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Static Website</h1>
        <p>Hosted using Microsoft Azure Static Web Apps</p>
    </header>

    <main>
        <h1>Welcome!</h1>
        <p>This website is hosted publicly using Microsoft Azure.</p>
        <p>Hisi Maharjan</p>
        <p>Cloud Computing Lab 6</p>
    </main>

    <footer>
        <p>Created for Azure Static Web Apps Lab</p>
    </footer>

</body>
</html>
